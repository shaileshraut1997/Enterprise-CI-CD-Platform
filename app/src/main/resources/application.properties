# ============================================================
# Enterprise CI/CD Platform
# Application Configuration
# ============================================================

# ------------------------------------------------------------
# Application
# ------------------------------------------------------------
spring.application.name=enterprise-cicd-platform

# ------------------------------------------------------------
# Server Configuration
# ------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1

# ------------------------------------------------------------
# Application Information
# ------------------------------------------------------------
app.name=Enterprise CI/CD Platform
app.version=1.0.0
app.environment=${ENVIRONMENT:development}

# ------------------------------------------------------------
# Spring Boot Actuator
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# ------------------------------------------------------------
# Actuator Information
# ------------------------------------------------------------
management.info.env.enabled=true

info.app.name=${app.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.shailesh.cicd=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
