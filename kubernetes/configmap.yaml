apiVersion: v1
kind: ConfigMap

metadata:
  name: enterprise-cicd-config
  namespace: enterprise-cicd

  labels:
    app: enterprise-cicd-platform

data:

  # Application environment
  ENVIRONMENT: "production"

  # Application name
  SPRING_APPLICATION_NAME: "enterprise-cicd-platform"

  # Java application port
  SERVER_PORT: "8080"

  # Application version
  APP_VERSION: "1.0.0"

  # Logging level
  LOGGING_LEVEL_ROOT: "INFO"
