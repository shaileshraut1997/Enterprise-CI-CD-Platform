# ============================================================
# Enterprise CI/CD Platform
# SonarQube Configuration
# ============================================================

# ------------------------------------------------------------
# Project Information
# ------------------------------------------------------------

sonar.projectKey=enterprise-cicd-platform
sonar.projectName=Enterprise CI/CD Platform
sonar.projectVersion=1.0.0

# ------------------------------------------------------------
# Source Configuration
# ------------------------------------------------------------

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# ------------------------------------------------------------
# Java Configuration
# ------------------------------------------------------------

sonar.java.source=21
sonar.java.binaries=app/target/classes

# ------------------------------------------------------------
# Test Reports
# ------------------------------------------------------------

sonar.junit.reportPaths=app/target/surefire-reports

# ------------------------------------------------------------
# Encoding
# ------------------------------------------------------------

sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------
# Exclusions
# ------------------------------------------------------------

sonar.exclusions=\
**/target/**,\
**/node_modules/**,\
**/*.log

# ------------------------------------------------------------
# Test Exclusions
# ------------------------------------------------------------

sonar.test.exclusions=\
**/target/**
